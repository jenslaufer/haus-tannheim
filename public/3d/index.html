<style>
  :root { --bg: #f4f2ee; --fg: #2b2a28; --muted: #6b6862; --panel: rgba(255,255,255,.88); --line: #d9d4cb; --accent: #8a3b2e; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d1c1a; --fg: #ece8e1; --muted: #a9a49b; --panel: rgba(36,35,33,.9); --line: #3b3935; --accent: #d9826f; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #1d1c1a; --fg: #ece8e1; --muted: #a9a49b; --panel: rgba(36,35,33,.9); --line: #3b3935; --accent: #d9826f; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #view { position: fixed; inset: 0; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; color: var(--muted); font-size: 15px; }
  .panel { position: fixed; left: calc(16px + env(safe-area-inset-left, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); max-width: min(340px, calc(100vw - 32px)); background: var(--panel);
           border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; backdrop-filter: blur(6px); }
  h1 { font-size: 17px; margin: 0 0 2px; }
  p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line);
           background: transparent; color: var(--fg); cursor: pointer; }
  button[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); text-align: right; font-size: 12px; color: var(--muted); pointer-events: none; }
</style>

  root.position.sub(new THREE.Vector3(c.x, 0, c.z));
  root.traverse(o => {

    const g = o.name.split("__")[0];

}));

function resize() {

  renderer.setSize(w, h);
  camera.aspect = w / h;
